name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read  # CI only reads the repo; least privilege for GITHUB_TOKEN

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # forge-precommit diffs changed files (docstrings, test-naming) vs main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pipenv"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfluidsynth3

      - name: Install pipenv and dependencies
        run: |
          pip install pipenv
          pipenv sync --dev   # install the lock verbatim (includes forge-scripts[typecheck,audit])

      - name: Install CPU-only torch
        # CPU-only project; PyPI's default torch is the CUDA build, which fails to
        # import without CUDA libs. Keep in range with torch~=2.11.0 (pyproject +
        # Dockerfile) — bump all three together.
        run: pipenv run pip install "torch==2.11.0" --index-url https://download.pytorch.org/whl/cpu

      # Forge owns the quality gate (config in [tool.forge], pyproject.toml):
      # ruff format+check (src/test/scripts), docstring verify + coverage,
      # pyrefly typecheck (advisory), and pip_audit. See README "Delegated to forge".
      - name: Forge pre-commit gate
        run: pipenv run forge-precommit

      - name: Forge FOUNDATION drift check
        run: pipenv run install-forge-claude-md --check

      # forge's ruff only scopes src/test/scripts; lint the remaining dirs here
      # (check-only: fail, don't auto-fix).
      - name: Ruff — examples + hf_space
        run: |
          pipenv run ruff check examples/ hf_space/
          pipenv run ruff format --check examples/ hf_space/

      # Tests run in CI for now (during forge adoption) to catch dependency-
      # resolution regressions the static gates miss. Revisit once the migration
      # is complete — the suite is long and is otherwise run locally.
      - name: Tests
        run: pipenv run pytest test/ -q
