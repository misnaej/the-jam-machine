name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # forge-precommit diffs changed files vs main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pipenv"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfluidsynth3

      - name: Install pipenv and dependencies
        run: |
          pip install pipenv
          pipenv sync --dev   # install lock verbatim; never re-resolve (deps are unpinned)

      - name: Ruff lint
        run: pipenv run ruff check src/ test/ examples/ hf_space/

      - name: Ruff format check
        run: pipenv run ruff format --check src/ test/ examples/ hf_space/

      - name: Docstring coverage
        run: pipenv run interrogate src/jammy/ --fail-under 95 -v

      - name: Security scan
        run: pipenv run bandit -r src/ -c pyproject.toml -q

      - name: Type check
        run: pipenv run mypy src/jammy/

      - name: Forge pre-commit gate
        run: pipenv run forge-precommit

      - name: Forge FOUNDATION drift check
        run: pipenv run install-forge-claude-md --check

      # Tests run in CI for now (during forge adoption) to catch dependency-
      # resolution regressions the static gates miss. Revisit once the migration
      # is complete — the suite is long and is otherwise run locally.
      - name: Tests
        run: pipenv run pytest test/ -q
