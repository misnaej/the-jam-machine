[build-system]
requires = ["setuptools", "setuptools.scm"]
build-backend = "setuptools.build_meta"

[project]
name = "the-jam-machine"
description = "generative AI assitant for composing music"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"

# Direct deps are pinned with compatible-release (`~=X.Y.Z`): allow patch
# updates, block minor/major bumps. Rationale: an unpinned re-lock once bumped
# transformers 5.4→5.12 (a MINOR) and broke `GPT2LMHeadModel`, so major-only
# caps are not enough. Exact versions live in Pipfile.lock; bump deliberately.
dependencies = [
    "miditok==1.3.2",
    "miditoolkit~=1.0.1",
    "matplotlib~=3.10.8",
    "numpy~=2.4.4",
    "pandas~=3.0.2",
    "mido~=1.3.3",
    "python-rtmidi~=1.5.8",
    "pretty-midi~=0.2.11",
    "note-seq~=0.0.5",
    "huggingface-hub~=1.8.0",
    # `~=1.3` (not `~=1.3.4`): 1.3.4 declares a `pyaudio` dependency (a C
    # extension that needs gcc/portaudio to build — absent in python:3.11-slim,
    # breaking the Docker build). 1.4.x dropped it; allow the minor bump.
    "pyFluidSynth~=1.3",
    "pydub~=0.25.1",
    "ffmpeg~=1.4",
    "wandb~=0.25.1",
    "tokenizers~=0.22.2",
    "datasets~=4.8.4",
    "gradio~=6.10.0",
    "transformers~=5.4.0",
    "torch~=2.11.0",
    "accelerate~=1.13.0",
    "fuzzywuzzy~=0.18.0",
    "httpx~=0.28.1",
]

[project.optional-dependencies]
# ruff + interrogate come transitively via forge-scripts; pyrefly via its
# `typecheck` extra; bandit is dropped (ruff's S rules cover SAST). pip-audit
# stays — forge runs the pip_audit step but doesn't ship the CLI (forge#71).
ci = ["pytest", "pytest-cov", "pytest-html", "pip-audit"]
notebooks = ["bertviz", "ipykernel", "scikit-learn", "nbconvert"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jammy = ["*.csv", "*.json"]

# Forge config — single source of truth for what forge-precommit operates on.
[tool.forge]
source_dirs = ["src"]
test_dirs = ["test"]

[tool.forge.precommit]
enable = ["typecheck"]  # opt in pyrefly (forge's type checker — supersedes mypy)

[tool.forge.typecheck]
paths = ["src", "test"]   # type-check package + tests (config in [tool.pyrefly])
blocking = true           # hard-fail on type errors (replaces the old mypy gate)

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
fail-under = 95
exclude = ["test/", "examples/"]
verbose = 1

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.pyrefly]
python-version = "3.11.0"
preset = "legacy"
ignore-missing-imports = ["*"]
# Treat imperfect third-party types as Any — miditok and transformers ship
# partial/outdated types that produce false positives (the old [tool.mypy]
# had ignore_missing_imports + a jammy.training.* ignore for the same reason).
replace-imports-with-any = ["miditok", "miditok.*", "transformers", "transformers.*"]

